<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Meu Player</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English:ital@0;1&family=Skranji:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English:ital@0;1&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Skranji:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <main class="player">
        <div class="main-card">

            <h2 id="musicTitle">
                Nenhuma música
            </h2>

            <img src="sapadechapeu.avif" alt="Capa da música" class="music-image">

            <p id="musicNumber">
                0 / 0
            </p>

            <audio id="audio"></audio>

            <div class="controls">

                <button id="previous">
                    ⏮️
                </button>

                <button id="play">
                    ▶️
                </button>

                <button id="next">
                    ⏭️
                </button>

            </div>

            <div class="progress-control"> <span id="currentTime">0:00</span> <input type="range" id="progress" min="0"
                    max="100" value="0" step="0.1"> <span id="duration">0:00</span> </div>

            <div class="volume-control">
                <span>🔊</span>

                <input type="range" id="volume" min="0" max="1" step="0.01" value="1">

                <span id="volumeValue">100%</span>
            </div>

        </div>

        <div class="options-card">
            <h1>🎵 Meu Player</h1>

            <button id="addMusic">
                Adicionar músicas
            </button>


            <h3>Playlist</h3>

            <div id="musicList"></div>

            <Button id="MusicFolderOpen">
                Abrir pasta das musicas
            </Button>

        </div>

    </main>

    <script src="renderer.js"></script>



</body>

</html>
